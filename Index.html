<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Type4Change</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game-screen">

    <!-- =========================================
         ESCENARIO PIXEL ART
    ========================================== -->

    <div class="world">

        <!-- CIELO -->
        <div class="sky">

            <div class="cloud cloud-1">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="cloud cloud-2">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="cloud cloud-3">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- MONTAÑAS -->
        <div class="mountains">

            <div class="mountain mountain-left"></div>
            <div class="mountain mountain-center"></div>
            <div class="mountain mountain-right"></div>

        </div>


        <!-- CIUDAD LEJANA -->
        <div class="city">

            <div class="building building-1"></div>
            <div class="building building-2"></div>
            <div class="building building-3"></div>
            <div class="building building-4"></div>
            <div class="building building-5"></div>
            <div class="building building-6"></div>
            <div class="building building-7"></div>

        </div>


        <!-- LAGO -->
        <div class="lake">

            <div class="water-line water-1"></div>
            <div class="water-line water-2"></div>
            <div class="water-line water-3"></div>
            <div class="water-line water-4"></div>
            <div class="water-line water-5"></div>

        </div>


        <!-- =========================================
             COSTA IZQUIERDA
        ========================================== -->

        <div class="island left-island">

            <div class="house house-left">

                <div class="house-roof"></div>

                <div class="house-wall">
                    <span class="window window-left"></span>
                    <span class="window window-right"></span>
                    <span class="door"></span>
                </div>

            </div>


            <div class="tree tree-l1">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

            <div class="tree tree-l2">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

            <div class="tree tree-l3">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

            <div class="tree tree-l4">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

        </div>


        <!-- =========================================
             COSTA DERECHA
        ========================================== -->

        <div class="island right-island">

            <div class="house house-right">

                <div class="house-roof"></div>

                <div class="house-wall">
                    <span class="window window-left"></span>
                    <span class="window window-right"></span>
                    <span class="door"></span>
                </div>

            </div>


            <div class="tree tree-r1">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

            <div class="tree tree-r2">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

            <div class="tree tree-r3">
                <div class="tree-top"></div>
                <div class="tree-trunk"></div>
            </div>

        </div>


        <!-- PUENTE -->
        <div class="bridge">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =========================================
             ACANTILADO DEL PERSONAJE
        ========================================== -->

        <div class="cliff">

            <div class="cliff-grass"></div>

            <span class="stone stone-1"></span>
            <span class="stone stone-2"></span>
            <span class="stone stone-3"></span>

        </div>


        <!-- =========================================
             PERSONAJE
        ========================================== -->

        <div class="player">

            <div class="player-shadow"></div>

            <div class="hair"></div>

            <div class="player-head"></div>

            <div class="player-neck"></div>

            <div class="player-body"></div>

            <div class="backpack">
                <span></span>
            </div>

            <div class="player-arm arm-left"></div>
            <div class="player-arm arm-right"></div>

            <div class="player-leg leg-left"></div>
            <div class="player-leg leg-right"></div>

            <div class="player-shoe shoe-left"></div>
            <div class="player-shoe shoe-right"></div>

        </div>


        <!-- =========================================
             MASCOTA
        ========================================== -->

        <div class="dog">

            <div class="dog-tail"></div>

            <div class="dog-body"></div>

            <div class="dog-head">

                <span class="dog-ear dog-ear-left"></span>
                <span class="dog-ear dog-ear-right"></span>

            </div>

            <div class="dog-leg dog-leg-left"></div>
            <div class="dog-leg dog-leg-right"></div>

        </div>

    </div>


    <!-- =========================================
         INTERFAZ
    ========================================== -->

    <button class="language" id="languageButton">
        🌐 ES
    </button>


    <!-- LOGO -->

    <header class="logo-container">

        <h1>
            TYPE<span>4</span>CHANGE
        </h1>

        <div class="tagline">
            Write. Act. Change.
        </div>

    </header>


    <!-- MENÚ -->

    <nav class="menu">

        <button
            class="game-button play"
            id="playButton"
        >
            JUGAR
        </button>

        <button
            class="game-button"
            id="settingsButton"
        >
            CONFIGURACIÓN
        </button>

        <button
            class="game-button"
            id="exitButton"
        >
            SALIR
        </button>

    </nav>


    <!-- FRASE -->

    <div class="quote">
        “Pequeñas palabras. Grandes cambios.”
    </div>


    <!-- TRANSICIÓN -->

    <div class="transition-screen" id="transitionScreen">

        <div class="loading-logo">
            TYPE<span>4</span>CHANGE
        </div>

        <p>Entrando al mundo...</p>

        <div class="loading-bar">
            <div></div>
        </div>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
