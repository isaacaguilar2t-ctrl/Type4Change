<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Type4Change | Lobby</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="lobby.css">
</head>

<body>

<main class="game-world">

    <!-- =========================
         FONDO
    ========================== -->

    <div class="sky"></div>

    <div class="sun"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="mountains mountains-back"></div>
    <div class="mountains mountains-front"></div>

    <div class="ground"></div>

    <!-- Decoración -->
    <div class="grass grass-1"></div>
    <div class="grass grass-2"></div>
    <div class="grass grass-3"></div>
    <div class="grass grass-4"></div>
    <div class="grass grass-5"></div>
    <div class="grass grass-6"></div>

    <!-- =========================
         ÁRBOLES
    ========================== -->

    <div class="tree tree-1">
        <div class="tree-shadow"></div>
        <div class="tree-trunk"></div>
        <div class="tree-crown crown-a"></div>
        <div class="tree-crown crown-b"></div>
        <div class="tree-crown crown-c"></div>
    </div>

    <div class="tree tree-2">
        <div class="tree-shadow"></div>
        <div class="tree-trunk"></div>
        <div class="tree-crown crown-a"></div>
        <div class="tree-crown crown-b"></div>
        <div class="tree-crown crown-c"></div>
    </div>

    <div class="tree tree-3">
        <div class="tree-shadow"></div>
        <div class="tree-trunk"></div>
        <div class="tree-crown crown-a"></div>
        <div class="tree-crown crown-b"></div>
        <div class="tree-crown crown-c"></div>
    </div>

    <div class="tree tree-4">
        <div class="tree-shadow"></div>
        <div class="tree-trunk"></div>
        <div class="tree-crown crown-a"></div>
        <div class="tree-crown crown-b"></div>
        <div class="tree-crown crown-c"></div>
    </div>

    <!-- =========================
         CAMINOS
    ========================== -->

    <div class="path path-main"></div>
    <div class="path path-left"></div>
    <div class="path path-right"></div>

    <!-- =========================
         PLAZA CENTRAL
    ========================== -->

    <div class="central-plaza">
        <div class="plaza-ring"></div>
        <div class="plaza-center"></div>

        <div class="fountain">
            <div class="water-ring"></div>
            <div class="water"></div>
            <div class="fountain-column"></div>
            <div class="fountain-top"></div>

            <span class="water-drop drop-1">◆</span>
            <span class="water-drop drop-2">◆</span>
            <span class="water-drop drop-3">◆</span>
        </div>
    </div>

    <!-- =========================
         ESTANQUES
    ========================== -->

    <div class="pond pond-left">
        <div class="pond-shine"></div>
        <div class="lily lily-1"></div>
        <div class="lily lily-2"></div>
    </div>

    <div class="pond pond-right">
        <div class="pond-shine"></div>
        <div class="lily lily-3"></div>
    </div>

    <!-- =========================
         EDIFICIO MISIONES
    ========================== -->

    <button class="building missions-building" onclick="openMissions()">

        <div class="building-shadow"></div>

        <div class="roof roof-green">
            <div class="roof-highlight"></div>
        </div>

        <div class="building-wall">

            <div class="sign">
                <span>!</span>
            </div>

            <div class="window window-left">
                <span></span>
            </div>

            <div class="door">
                <div class="door-knob"></div>
            </div>

            <div class="window window-right">
                <span></span>
            </div>

        </div>

        <span class="building-label">
            MISIONES
        </span>

    </button>

    <!-- =========================
         EDIFICIO TIENDA
    ========================== -->

    <button class="building shop-building" onclick="openShop()">

        <div class="building-shadow"></div>

        <div class="roof roof-purple">
            <div class="roof-highlight"></div>
        </div>

        <div class="building-wall">

            <div class="sign shop-sign">
                <span>★</span>
            </div>

            <div class="window window-left">
                <span></span>
            </div>

            <div class="door">
                <div class="door-knob"></div>
            </div>

            <div class="window window-right">
                <span></span>
            </div>

        </div>

        <span class="building-label">
            TIENDA
        </span>

    </button>

    <!-- =========================
         BANCAS
    ========================== -->

    <div class="bench bench-1">
        <div class="bench-seat"></div>
        <div class="bench-leg"></div>
    </div>

    <div class="bench bench-2">
        <div class="bench-seat"></div>
        <div class="bench-leg"></div>
    </div>

    <div class="bench bench-3">
        <div class="bench-seat"></div>
        <div class="bench-leg"></div>
    </div>

    <!-- =========================
         NPCs
    ========================== -->

    <div class="npc npc-1">
        <div class="npc-shadow"></div>
        <div class="npc-hair"></div>
        <div class="npc-head"></div>
        <div class="npc-body"></div>
        <div class="npc-leg"></div>
    </div>

    <div class="npc npc-2">
        <div class="npc-shadow"></div>
        <div class="npc-hair"></div>
        <div class="npc-head"></div>
        <div class="npc-body"></div>
        <div class="npc-leg"></div>
    </div>

    <!-- =========================
         PERSONAJE
    ========================== -->

    <div class="player-area">

        <div class="player-shadow"></div>

        <div class="player-character">

            <div class="player-hair"></div>

            <div class="player-head">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
            </div>

            <div class="player-body"></div>

            <div class="player-arm arm-left"></div>
            <div class="player-arm arm-right"></div>

            <div class="player-leg leg-left"></div>
            <div class="player-leg leg-right"></div>

        </div>

        <div class="player-name">
            USUARIO
        </div>

    </div>

    <!-- =========================
         MARCAS DE MISIÓN
    ========================== -->

    <div class="quest-mark quest-1">!</div>
    <div class="quest-mark quest-2">!</div>

    <!-- =========================
         TÍTULO
    ========================== -->

    <header class="world-title">

        <div class="title-main">
            TYPE<span>4</span>CHANGE
        </div>

        <div class="title-sub">
            COMMUNITY PARK
        </div>

    </header>

    <!-- =========================
         HUD JUGADOR
    ========================== -->

    <section class="player-hud">

        <div class="avatar">
            <div class="avatar-hair"></div>
            <div class="avatar-face">
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="player-info">

            <h2>USUARIO</h2>

            <p>
                NIVEL <strong id="playerLevel">3</strong>
            </p>

            <div class="xp-container">
                <div class="xp-bar" id="xpBar"></div>
            </div>

            <small>
                <span id="xpValue">120</span> / 300 XP
            </small>

        </div>

    </section>

    <!-- =========================
         HUD SUPERIOR DERECHO
    ========================== -->

    <div class="top-right">

        <div class="currency">
            <span class="coin-icon">★</span>
            <strong id="coins">520</strong>
        </div>

        <button class="hud-button" onclick="openSettings()">
            ⚙
        </button>

        <button class="hud-button notification" onclick="showNotification()">
            🔔
            <b>1</b>
        </button>

    </div>

    <!-- =========================
         MENSAJE DE BIENVENIDA
    ========================== -->

    <div class="welcome-box">

        <div class="welcome-icon">
            !
        </div>

        <div>

            <strong>
                ¡BIENVENIDO DE NUEVO!
            </strong>

            <p>
                Hoy puedes hacer la diferencia.
                Elige una misión para comenzar.
            </p>

        </div>

    </div>

    <!-- =========================
         BOTONES DEL MUNDO
    ========================== -->

    <button class="world-button world-button-left" onclick="openWorlds()">
        <span class="button-icon">◎</span>
        <span>EXPLORA MUNDOS</span>
    </button>

    <button class="world-button world-button-achievements" onclick="openAchievements()">
        <span class="button-icon">★</span>
        <span>LOGROS</span>
    </button>

    <button class="world-button world-button-character" onclick="openCharacter()">
        <span class="button-icon">●</span>
        <span>PERSONAJE</span>
    </button>

    <!-- =========================
         MENÚ INFERIOR
    ========================== -->

    <nav class="bottom-menu">

        <button class="menu-item active" onclick="openMissions()">
            <span>!</span>
            <label>MISIONES</label>
        </button>

        <button class="menu-item" onclick="openWorlds()">
            <span>◎</span>
            <label>MUNDOS</label>
        </button>

        <button class="menu-item" onclick="openCharacter()">
            <span>●</span>
            <label>PERSONAJE</label>
        </button>

        <button class="menu-item" onclick="openAchievements()">
            <span>★</span>
            <label>LOGROS</label>
        </button>

        <button class="menu-item" onclick="openShop()">
            <span>◆</span>
            <label>TIENDA</label>
        </button>

    </nav>

    <!-- =========================
         MODAL
    ========================== -->

    <div class="modal" id="gameModal">

        <div class="modal-box">

            <button class="close-modal" onclick="closeModal()">
                ×
            </button>

            <div id="modalContent"></div>

        </div>

    </div>

</main>

<script src="lobby.js"></script>

</body>
</html>
