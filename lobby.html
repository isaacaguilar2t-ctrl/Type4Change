<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Type4Change | Lobby</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="lobby.css">
</head>

<body>

<main class="game">

    <!-- ========================================
         BARRA SUPERIOR
    ========================================= -->

    <header class="game-header">
        <span>★ LOBBY</span>
        <span>/</span>
        <span>MENÚ PRINCIPAL</span>
    </header>


    <!-- ========================================
         MAPA DEL LOBBY
    ========================================= -->

    <section class="world">

        <!-- TEXTURA -->
        <div class="grass-texture"></div>

        <!-- CAMINOS -->
        <div class="road road-horizontal"></div>
        <div class="road road-vertical"></div>

        <div class="road-circle"></div>

        <!-- ================================
             BOSQUES
        ================================= -->

        <div class="forest forest-left-top"></div>
        <div class="forest forest-right-top"></div>
        <div class="forest forest-left-bottom"></div>
        <div class="forest forest-right-bottom"></div>


        <!-- ================================
             CASAS SUPERIORES
        ================================= -->

        <div class="house house-1">
            <div class="house-roof red"></div>
            <div class="house-body">
                <div class="house-window"></div>
                <div class="house-door"></div>
                <div class="house-window"></div>
            </div>
        </div>

        <div class="house house-2">
            <div class="house-roof orange"></div>
            <div class="house-body">
                <div class="house-window"></div>
                <div class="house-door"></div>
                <div class="house-window"></div>
            </div>
        </div>

        <div class="house house-3">
            <div class="house-roof blue"></div>
            <div class="house-body">
                <div class="house-window"></div>
                <div class="house-door"></div>
                <div class="house-window"></div>
            </div>
        </div>

        <div class="house house-4">
            <div class="house-roof purple"></div>
            <div class="house-body">
                <div class="house-window"></div>
                <div class="house-door"></div>
                <div class="house-window"></div>
            </div>
        </div>


        <!-- ================================
             EDIFICIO DE MISIONES
        ================================= -->

        <button class="special-building mission-house" onclick="openMissions()">

            <div class="special-roof green-roof">
                <span>!</span>
            </div>

            <div class="special-body">
                <div class="special-window"></div>
                <div class="special-door"></div>
                <div class="special-window"></div>
            </div>

            <div class="building-name">
                MISIONES
            </div>

        </button>


        <!-- ================================
             TIENDA
        ================================= -->

        <button class="special-building store-house" onclick="openShop()">

            <div class="special-roof purple-roof">
                <span>★</span>
            </div>

            <div class="special-body">
                <div class="special-window"></div>
                <div class="special-door"></div>
                <div class="special-window"></div>
            </div>

            <div class="building-name">
                TIENDA
            </div>

        </button>


        <!-- ================================
             ESTANQUES
        ================================= -->

        <div class="pond pond-left">
            <div class="water-shine shine-1"></div>
            <div class="water-shine shine-2"></div>

            <div class="lily lily-1"></div>
            <div class="lily lily-2"></div>
        </div>

        <div class="pond pond-right">
            <div class="water-shine shine-1"></div>
            <div class="water-shine shine-2"></div>

            <div class="lily lily-1"></div>
            <div class="lily lily-2"></div>
        </div>


        <!-- ================================
             PLAZA CENTRAL
        ================================= -->

        <div class="plaza">

            <div class="plaza-floor"></div>

            <div class="fountain">

                <div class="fountain-shadow"></div>

                <div class="fountain-base">
                    <div class="fountain-water"></div>
                </div>

                <div class="fountain-column"></div>

                <div class="fountain-top"></div>

                <div class="water-stream stream-left"></div>
                <div class="water-stream stream-right"></div>

            </div>

            <div class="plaza-sign">
                TYPE<span>4</span>CHANGE
            </div>

        </div>


        <!-- ================================
             FLORES
        ================================= -->

        <div class="flowers flowers-1">✿ ✿ ✿</div>
        <div class="flowers flowers-2">✿ ✿</div>
        <div class="flowers flowers-3">✿ ✿ ✿</div>
        <div class="flowers flowers-4">✿ ✿</div>


        <!-- ================================
             BANCAS
        ================================= -->

        <div class="bench bench-1">
            <div></div>
        </div>

        <div class="bench bench-2">
            <div></div>
        </div>

        <div class="bench bench-3">
            <div></div>
        </div>


        <!-- ================================
             NPC 1
        ================================= -->

        <div class="npc npc-one">

            <div class="npc-alert">!</div>

            <div class="npc-shadow"></div>

            <div class="npc-character">
                <div class="npc-hair"></div>
                <div class="npc-face"></div>
                <div class="npc-shirt orange-shirt"></div>
                <div class="npc-feet"></div>
            </div>

        </div>


        <!-- ================================
             NPC 2
        ================================= -->

        <div class="npc npc-two">

            <div class="npc-shadow"></div>

            <div class="npc-character">
                <div class="npc-hair npc-hair-girl"></div>
                <div class="npc-face"></div>
                <div class="npc-shirt pink-shirt"></div>
                <div class="npc-feet"></div>
            </div>

        </div>


        <!-- ================================
             NPC 3
        ================================= -->

        <div class="npc npc-three">

            <div class="npc-alert">!</div>

            <div class="npc-shadow"></div>

            <div class="npc-character">
                <div class="npc-hair blond-hair"></div>
                <div class="npc-face"></div>
                <div class="npc-shirt blue-shirt"></div>
                <div class="npc-feet"></div>
            </div>

        </div>


        <!-- ================================
             JUGADOR
        ================================= -->

        <div class="player-area" id="player">

            <div class="player-shadow"></div>

            <div class="player">

                <div class="player-hair"></div>

                <div class="player-face">
                    <span class="eye left-eye"></span>
                    <span class="eye right-eye"></span>
                </div>

                <div class="player-shirt"></div>

                <div class="player-legs"></div>

            </div>

            <div class="player-tag">
                USUARIO
            </div>

        </div>


        <!-- ========================================
             HUD PERFIL
        ========================================= -->

        <section class="player-hud">

            <div class="avatar">

                <div class="avatar-hair"></div>

                <div class="avatar-face">
                    <span></span>
                    <span></span>
                </div>

            </div>

            <div class="player-info">

                <strong>USUARIO</strong>

                <div class="level">
                    Nivel <b id="playerLevel">3</b>
                </div>

                <div class="xp">

                    <div class="xp-bar">
                        <div class="xp-progress" id="xpBar"></div>
                    </div>

                    <small>
                        <span id="xpValue">120</span> / 300 XP
                    </small>

                </div>

            </div>

        </section>


        <!-- ========================================
             MONEDAS
        ========================================= -->

        <div class="top-controls">

            <div class="currency">
                <span>★</span>
                <strong id="coins">520</strong>
            </div>

            <div class="gem-counter">
                <span>◆</span>
                <strong>12</strong>
            </div>

            <button onclick="openSettings()" class="settings">
                ⚙
            </button>

        </div>


        <!-- ========================================
             MENÚ DERECHO
        ========================================= -->

        <nav class="side-menu">

            <button onclick="openMissions()">
                <span>★</span>
                MISIONES
            </button>

            <button onclick="openWorlds()">
                <span>★</span>
                MUNDOS
            </button>

            <button onclick="openCharacter()">
                <span>★</span>
                PERSONAJE
            </button>

            <button onclick="openAchievements()">
                <span>★</span>
                LOGROS
            </button>

            <button onclick="openShop()">
                <span>★</span>
                TIENDA
            </button>

        </nav>


        <!-- ========================================
             DIÁLOGO INFERIOR
        ========================================= -->

        <div class="dialog-box">

            <div class="dialog-avatar">

                <div class="dialog-hair"></div>
                <div class="dialog-face"></div>

            </div>

            <div class="dialog-content">

                <strong>GUÍA</strong>

                <p id="dialogText">
                    Aquí comienza tu aventura.<br>
                    Explora, escribe y forma parte del cambio.
                </p>

            </div>

            <div class="dialog-next">
                ▼
            </div>

        </div>


        <!-- CONTROLES -->
        <div class="movement-tip">
            <span>WASD</span>
            MOVERSE
        </div>

    </section>


    <!-- ========================================
         MODAL
    ========================================= -->

    <div class="modal" id="gameModal">

        <div class="modal-box">

            <button
                class="close-modal"
                onclick="closeModal()"
            >
                ×
            </button>

            <div id="modalContent"></div>

        </div>

    </div>

</main>

<script src="lobby.js"></script>

</body>
</html>
